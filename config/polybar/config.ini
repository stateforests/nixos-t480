[colors]
background = #0b0b0b
background-alt = #151515
foreground = #e5e5e5
muted = #777777
border = #292929
urgent = #d0d0d0

[bar/main]
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 0
padding-left = 1
padding-right = 1

module-margin = 1

font-0 = DejaVu Sans Mono:size=9;2

modules-left = bspwm
modules-center = player
modules-right = cpu memory battery pulseaudio date

tray-position = right
tray-padding = 1

cursor-click = pointer
cursor-scroll = ns-resize

[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-padding = 1
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.background-alt}

label-occupied = %name%
label-occupied-padding = 1
label-occupied-foreground = ${colors.muted}

label-empty = %name%
label-empty-padding = 1
label-empty-foreground = ${colors.border}

[module/player]
type = custom/script
exec = playerctl metadata --format '{{ artist }} - {{ title }}' 2>/dev/null
interval = 2
format = <label>
label = %output%
label-maxlen = 60
label-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/memory]
type = internal/memory
interval = 2
label = RAM %percentage_used%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
label-charging = BAT %percentage%%
label-discharging = BAT %percentage%%
label-full = BAT full

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
label-volume = VOL %percentage%%
label-muted = VOL muted

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%
